<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7FFFD"/>

  <text x="800" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#000000">
    Flux d'exécution de l'architecture du projet
  </text>
  <text x="800" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1A2C3E">
    Controller - Service - Repository - Model - Base de données - View
  </text>

  <rect x="90" y="240" width="210" height="120" rx="28" fill="#FFFFFF" stroke="#1A2C3E" stroke-width="2"/>
  <text x="195" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">Controller</text>
  <text x="195" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C3E">Reçoit la requête</text>

  <rect x="370" y="240" width="210" height="120" rx="28" fill="#A7FEEB" stroke="#1A2C3E" stroke-width="2"/>
  <text x="475" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">Service</text>
  <text x="475" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C3E">Logique métier</text>

  <rect x="650" y="240" width="230" height="120" rx="28" fill="#FFFFFF" stroke="#1A2C3E" stroke-width="2"/>
  <text x="765" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">Repository</text>
  <text x="765" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C3E">Accès aux données</text>

  <rect x="950" y="240" width="210" height="120" rx="28" fill="#A7FEEB" stroke="#1A2C3E" stroke-width="2"/>
  <text x="1055" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">Model</text>
  <text x="1055" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C3E">Représente la table</text>

  <rect x="1230" y="240" width="280" height="120" rx="28" fill="#F6FF18" stroke="#1A2C3E" stroke-width="2"/>
  <text x="1370" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">Base de données</text>
  <text x="1370" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C3E">Stockage des informations</text>

  <rect x="690" y="570" width="220" height="120" rx="28" fill="#FFFFFF" stroke="#1A2C3E" stroke-width="2"/>
  <text x="800" y="622" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">View</text>
  <text x="800" y="655" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A2C3E">Affichage final</text>

  <line x1="300" y1="300" x2="370" y2="300" stroke="#000000" stroke-width="4"/>
  <polygon points="370,300 352,290 352,310" fill="#000000"/>

  <line x1="580" y1="300" x2="650" y2="300" stroke="#000000" stroke-width="4"/>
  <polygon points="650,300 632,290 632,310" fill="#000000"/>

  <line x1="880" y1="300" x2="950" y2="300" stroke="#000000" stroke-width="4"/>
  <polygon points="950,300 932,290 932,310" fill="#000000"/>

  <line x1="1160" y1="300" x2="1230" y2="300" stroke="#000000" stroke-width="4"/>
  <polygon points="1230,300 1212,290 1212,310" fill="#000000"/>

  <path d="M1370 360 C1370 470, 980 470, 980 520" stroke="#1A2C3E" stroke-width="4" fill="none" stroke-dasharray="10 10"/>
  <polygon points="980,520 969,501 991,501" fill="#1A2C3E"/>

  <path d="M690 630 C530 630, 400 570, 290 450 C235 390, 210 360, 195 360" stroke="#1A2C3E" stroke-width="4" fill="none" stroke-dasharray="10 10"/>
  <polygon points="195,360 214,371 214,349" fill="#1A2C3E"/>

  <line x1="800" y1="520" x2="800" y2="570" stroke="#000000" stroke-width="4"/>
  <polygon points="800,570 790,552 810,552" fill="#000000"/>

  <rect x="120" y="760" width="1360" height="78" rx="20" fill="#FFFFFF" stroke="#1A2C3E" stroke-width="1.5"/>
  <text x="800" y="808" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#000000">
    Chemin principal : Controller → Service → Repository → Model → Base de données → Controller → View
  </text>

  <text x="800" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1A2C3E">
    Retour des données vers le Controller
  </text>
</svg>
